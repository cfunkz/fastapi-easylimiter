name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04  # newer images no longer ship Python 3.9
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get install -y -q redis-server  # tests start their own servers, incl. a 3-node cluster
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
